# Mantiene la liga al día sin depender de que el Mac esté encendido.
#
# Cada hora: baja lo nuevo de Mister, rehace las cuentas, genera la página
# y la publica en GitHub Pages. Es lo mismo que hace `npm run refrescar` en local.
#
# Necesita dos secretos del repositorio, que son la sesión de Mister:
#   MISTER_COOKIE   la cookie de sesión
#   MISTER_AUTH     el token X-Auth
# Caducan cada cierto tiempo. Cuando pase, esto falla y GitHub avisa por correo;
# se arregla pegando los nuevos en Settings → Secrets and variables → Actions.
name: Actualizar la liga

on:
  schedule:
    # Las veinticuatro horas, no solo de día: la primera versión solo cubría de
    # 7 a 21 UTC y se publicó pasada esa hora, así que en toda la noche no llegó
    # a saltar ni una vez y la página se quedó envejeciendo sin que nada fallara.
    # Cubrir el día entero también quita el desfase del horario de verano, que
    # movía la ventana una hora en octubre.
    #
    # Al minuto 17, no en punto: GitHub encola en el minuto 0 el cron de medio
    # mundo. Una pasada por hora mantiene mercado, bajas, probabilidades y xG
    # bajo el mismo sello temporal sin castigar innecesariamente las fuentes.
    - cron: '17 * * * *'
  workflow_dispatch:

# Un solo trabajo a la vez: dos a la vez se pisarían los datos.
concurrency:
  group: actualizar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      # La punta de `main`, no el commit fijado al dispararse. Con dos disparos
      # seguidos la segunda pasada espera en cola —eso está bien— pero al
      # arrancar hacía el checkout del commit de cuando se lanzó, ya viejo,
      # y GitHub le rechazaba el push por trabajar sobre datos anteriores.
      # El 9 de septiembre de 2026, a las 18:37 y 18:38, la segunda falló así.
      #
      # El histórico entero (`fetch-depth: 0`) es para poder rebasar si aun así
      # alguien guarda antes; pesa unos cientos de KB.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # El volcado del feed vive aquí y NO en el repositorio: son 13 MB y, sobre
      # todo, lleva dentro los correos de los rivales. La caché de Actions es
      # privada aunque el repositorio sea público.
      - name: Recuperar el volcado del feed
        uses: actions/cache@v4
        with:
          path: datos
          key: volcado-${{ github.run_id }}
          restore-keys: volcado-

      - name: Poner la sesión de Mister
        env:
          COOKIE: ${{ secrets.MISTER_COOKIE }}
          AUTH: ${{ secrets.MISTER_AUTH }}
        run: |
          if [ -z "$COOKIE" ] || [ -z "$AUTH" ]; then
            echo "::error::Faltan los secretos MISTER_COOKIE y MISTER_AUTH."
            exit 1
          fi
          mkdir -p .sesion
          printf '%s' "$COOKIE" > .sesion/cookie
          printf '%s' "$AUTH" > .sesion/auth
          chmod 600 .sesion/cookie .sesion/auth

      # Las fichas, en cada pasada y no una vez al día.
      #
      # Antes se pedían las 523 todos los días porque también servían para la
      # serie de valores; pero esa serie la rellena la pasada normal desde el
      # censo, en once peticiones. Los demás campos —goles, tarjetas, medias,
      # titularidades— solo cambian cuando el jugador juega, y eso se sabe
      # mirando si le han subido los partidos.
      #
      # Así que ahora se pide solo a quien le ha pasado algo, con tope de 120
      # por pasada: dos minutos en vez de cincuenta. Después de una jornada
      # cambian trescientas y se reparten entre las pasadas horarias siguientes.
      #
      # El tope de tiempo y el `continue-on-error` se quedan de red: el 7 de
      # septiembre de 2026 una de estas se colgó cuarenta y nueve minutos y
      # congeló detrás el saldo, las cláusulas y el mercado.
      # Las probabilidades cambian durante el día conforme llegan partes y ruedas
      # de prensa, así que no vale con una vez al día. Pero cada pasada son
      # veinte peticiones y 5,4 MB contra un servidor que no es nuestro: cada
      # hora serían 480 peticiones y 130 MB diarios. Cada tres horas —ocho veces
      # al día— coge esos partes con margen de sobra y deja la carga en un
      # tercio.
      #
      # La condición va dentro y no en un `if:` porque el cron es horario y
      # GitHub no da la hora en las expresiones: se mira aquí y se sale sin
      # hacer nada cuando no toca.
      #
      # Si la fuente falla, `continue-on-error` conserva el último fichero bueno.
      - name: Alineaciones probables de FútbolFantasy
        timeout-minutes: 6
        continue-on-error: true
        run: |
          hora=$(date -u +%H)
          if [ $((10#$hora % 3)) -ne 0 ]; then
            echo "Las probables van cada tres horas y ahora son las ${hora}:00 UTC. Esta pasada se la salta."
            exit 0
          fi
          npm run probables

      - name: Noticias relevantes de FútbolFantasy
        timeout-minutes: 2
        continue-on-error: true
        run: npm run noticias

      - name: Guardar la alineación de las jornadas jugadas
        timeout-minutes: 3
        continue-on-error: true
        run: npm run alineaciones

      - name: Bajar la cara de los jugadores nuevos
        timeout-minutes: 4
        continue-on-error: true
        run: |
          sudo apt-get install -qq -y webp
          npm run fotos

      - name: Refrescar las fichas que hayan cambiado
        timeout-minutes: 8
        continue-on-error: true
        run: npm run fichas

      # Si las cuentas no cuadran con las de Mister, esto sale con error y no
      # escribe nada. Es lo correcto: mejor los datos de la pasada anterior que unos
      # malos sin avisar.
      - name: Actualizar y generar
        run: npm run refrescar

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name  'Actualización automática'
          git config user.email 'actions@github.com'
          git add modulo/datos modulo/fotos
          if git diff --cached --quiet; then
            echo "Nada que guardar: no ha cambiado ningún dato."
            exit 0
          fi
          git commit -m "Datos de Mister al $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Si otra pasada —o una sesión desde el Mac— guardó antes, el push
          # sale rechazado. En vez de fallar y mandar un correo, se pone al día
          # y repite. Cuidado con el sentido de `-X theirs` en un rebase: ahí
          # «theirs» es el commit que se está reaplicando, o sea ESTE, así que
          # en un choque de datos gana la instantánea más nueva, que es la de
          # esta pasada. Solo toca modulo/datos y modulo/fotos: nunca código.
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rechazado (intento $intento): otra pasada guardó antes. Me pongo al día y repito."
            git fetch origin main
            git rebase -X theirs origin/main
          done
          echo "No pude guardar tras tres intentos."
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: datos/sitio
      - id: despliegue
        uses: actions/deploy-pages@v4

      - name: Borrar la sesión
        if: always()
        run: rm -rf .sesion
