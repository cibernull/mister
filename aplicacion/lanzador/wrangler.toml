name = "liga-de-mister"
main = "worker.js"
compatibility_date = "2026-01-01"

# El reloj de verdad. Una vez por hora, desplazado del minuto en punto, igual
# que el cron de GitHub — pero este sí es puntual.
[triggers]
crons = ["17 * * * *"]

# El token NO va aquí. Va como secreto, que no se guarda en el repositorio:
#   npx wrangler secret put GITHUB_TOKEN
# o en el panel: Workers → liga-de-mister → Settings → Variables → Secrets.
